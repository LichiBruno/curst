swagger: "2.0"
info:
  title: Shelter
  version: "1"
host: shelter.example.com
basePath: /v1
schemes: [http, https]
securityDefinitions:
  login:
    type: basic
security:
  - login: []
paths:
  /pets:
    get:
      tags: [pets]
      summary: List pets
      parameters:
        - name: limit
          in: query
          type: integer
          default: 20
        - name: species
          in: query
          required: true
          type: string
          enum: [cat, dog]
      responses:
        200:
          description: ok
    post:
      tags: [pets]
      summary: Add a pet
      parameters:
        - name: pet
          in: body
          schema:
            $ref: "#/definitions/Pet"
      responses:
        201:
          description: created
  /pets/{petId}/photo:
    parameters:
      - name: petId
        in: path
        required: true
        type: string
        x-example: "7"
    put:
      tags: [photos]
      operationId: uploadPhoto
      consumes: [application/x-www-form-urlencoded]
      parameters:
        - name: caption
          in: formData
          type: string
        - name: X-Trace
          in: header
          type: string
      responses:
        204:
          description: done
definitions:
  Pet:
    type: object
    properties:
      name:
        type: string
        example: Rex
      born:
        type: string
        format: date
      vaccinated:
        type: boolean
