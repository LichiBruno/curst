[package]
name = "curst-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
age = "0.12.1"
curl = { version = "0.4.51", default-features = false, features = ["static-curl", "rustls", "http2"] }
etcetera = "0.11.0"
getrandom = "0.4.3"
keyring-core = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"
zeroize = "1.9.1"

[lints]
workspace = true

[dev-dependencies]
httpmock = { version = "0.9.0", features = ["https"] }
proptest = "1.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
