[package]
name = "curst-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
curl = { version = "0.4.51", default-features = false, features = ["static-curl", "rustls", "http2"] }
etcetera = "0.11.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.1"

[lints]
workspace = true

[dev-dependencies]
httpmock = { version = "0.9.0", features = ["https"] }
proptest = "1.12.0"
